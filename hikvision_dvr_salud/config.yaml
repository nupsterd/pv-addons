name: "Salud del DVR Hikvision (Portería Virtual)"
version: "0.2.0-alpha"
slug: hikvision_dvr_salud
description: >
  Lee por ISAPI, con un usuario de solo lectura y a lo sumo una consulta por
  minuto, la señal, la grabación, el disco, la hora y el registro de excepciones
  de un DVR Hikvision. Reporta un latido y cada cambio de señal al backend con una
  cola persistente. Con verificacion_video prendida, además baja por RTSP tramos
  de grabación solo para la verificación de puertas forzadas y los sube al backend.

image: "ghcr.io/nupsterd/{arch}-hikvision-dvr-salud"

arch:
  - aarch64

startup: services
# Manual a propósito: un add-on con la clave vacía y arranque automático puede bloquear
# la cuenta del equipo. Se pasa a auto después del primer arranque correcto.
boot: manual
init: false
# GET /host/info (dt_synchronized) para no fechar registros con el reloj sin NTP.
hassio_api: true
# /tmp en RAM: la clave del RTSP y los clips nunca tocan el disco.
tmpfs: true

options:
  dvr_host: ""
  dvr_user: "pvlectura"
  dvr_password: ""
  device_serial: ""
  backend_url: ""
  backend_secret: ""
  canales_excluidos: []
  desfase_max_s: 60
  latido_minutos: 5
  log_level: "info"
  verificacion_video: false

schema:
  dvr_host: str
  dvr_user: str
  dvr_password: password
  device_serial: str
  backend_url: "str?"
  backend_secret: "password?"
  canales_excluidos:
    - int(1,)
  desfase_max_s: int(10,600)
  latido_minutos: int(5,15)
  log_level: list(debug|info|warning)
  verificacion_video: bool

map:
  - addon_config:rw    # /config -> /addon_configs/<slug>/ (auditoría visible desde el add-on SSH)
