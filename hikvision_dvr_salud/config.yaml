name: "Salud del DVR Hikvision (Portería Virtual)"
version: "0.1.0-alpha"
slug: hikvision_dvr_salud
description: >
  Lee por ISAPI, con un usuario de solo lectura y a lo sumo una consulta por
  minuto, la señal, la grabación, el disco, la hora y el registro de excepciones
  de un DVR Hikvision. Reporta un latido y cada cambio de señal al backend con una
  cola persistente. Nunca toca video, fotos ni clips.

image: "ghcr.io/nupsterd/{arch}-hikvision-dvr-salud"

arch:
  - aarch64

startup: services
# Manual a propósito: un add-on con la clave vacía y arranque automático ya bloqueó
# una cuenta (§5.9.574). Se pasa a auto en la Pi después del primer arranque correcto.
boot: manual
init: false
# GET /host/info (dt_synchronized) para no fechar registros con el reloj sin NTP.
hassio_api: true

options:
  dvr_host: ""
  dvr_user: "pvlectura"
  dvr_password: ""
  device_serial: ""
  backend_url: ""
  backend_secret: ""
  canales_excluidos: []
  desfase_max_s: 60
  latido_minutos: 5
  log_level: "info"

schema:
  dvr_host: str
  dvr_user: str
  dvr_password: password
  device_serial: str
  backend_url: "str?"
  backend_secret: "password?"
  canales_excluidos:
    - int(1,)
  desfase_max_s: int(10,600)
  latido_minutos: int(5,15)
  log_level: list(debug|info|warning)

map:
  - addon_config:rw    # /config -> /addon_configs/<slug>/ (auditoría visible desde el add-on SSH)
