name: "Visión (Portería Virtual)"
version: "0.4.0-alpha"
slug: pv_vision
description: >
  Detector de personas + conteo de línea de una cámara RTSP (Dahua), en vivo
  24/7 o sobre archivos. Manda al backend de Portería Virtual solo los cruces
  y un latido (sin imágenes). Grabador opcional, sin recodificar, en
  /media/pv_vision/ (apagado, por ventanas horarias o solo los segmentos con
  salidas del vivo), con retención máxima de 30 días. El video no sale de la Pi.
image: "ghcr.io/nupsterd/{arch}-pv-vision"

arch:
  - aarch64

startup: services
boot: auto
init: false
hassio_api: true
tmpfs: true

options:
  camera_host: ""
  camera_user: ""
  camera_password: ""
  stream: "main"
  ventanas:
    - "06:20-06:50"
    - "11:50-12:20"
    - "18:00-18:50"
  dias: [1, 2, 3, 4, 5]
  segment_seconds: 300
  retencion_dias: 30
  min_free_gb: 10
  tz: "America/Bogota"
  log_level: "info"
  grabador: "apagado"
  analisis_activo: false
  analisis_dir: "/media/pv_vision/conjunto_b"
  analisis_modelos:
    - "yolox_nano"
  analisis_cada_n: 3
  analisis_hilos: 3
  analisis_solo_fuera_de_ventanas: true
  roi: "960:720:500:360"
  linea: "500,467,1113,1080"
  sentido_salida: "izq_a_der"
  punto_referencia: "pie"
  histeresis_px: 12
  cuadros_confirmacion: 2
  conf_alta: 0.5
  conf_baja: 0.1
  track_buffer_s: 1.5
  min_hits: 3
  referencia_desde: ""
  depuracion_clips: []
  rebote: "ninguno"
  vivo_activo: false
  vivo_sin_cuadros_s: 15
  vivo_retencion_dias: 30
  backend_url: ""
  backend_secret: ""
  device_serial: ""
  backend_timeout_seconds: 5
  heartbeat_interval_minutes: 15
  outbox_max_records: 100000
  outbox_max_age_days: 7

schema:
  camera_host: str
  camera_user: str
  camera_password: password
  stream: list(main|sub)
  ventanas:
    - "match(^[0-9]{2}:[0-9]{2}-[0-9]{2}:[0-9]{2}$)"
  dias:
    - int(1,7)
  segment_seconds: int(30,3600)
  retencion_dias: int(1,30)
  min_free_gb: int(1,1000)
  tz: str
  log_level: list(debug|info|warning)
  grabador: list(apagado|ventanas|por_cruce)
  analisis_activo: bool
  analisis_dir: str
  analisis_modelos:
    - list(yolox_nano|yolox_tiny|yolox_s)
  analisis_cada_n: int(1,25)
  analisis_hilos: int(1,3)
  analisis_solo_fuera_de_ventanas: bool
  roi: "match(^[0-9]+:[0-9]+:[0-9]+:[0-9]+$)"
  linea: "match(^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$)"
  sentido_salida: list(izq_a_der|der_a_izq)
  punto_referencia: list(pie|centro)
  histeresis_px: int(0,200)
  cuadros_confirmacion: int(1,10)
  conf_alta: float(0.01,1)
  conf_baja: float(0.01,1)
  track_buffer_s: float(0.1,10)
  min_hits: int(1,10)
  referencia_desde: "str?"
  depuracion_clips:
    - str
  rebote: list(ninguno|neto_por_track)
  vivo_activo: bool
  vivo_sin_cuadros_s: int(5,120)
  vivo_retencion_dias: int(1,90)
  backend_url: "str?"
  backend_secret: "password?"
  device_serial: "str?"
  backend_timeout_seconds: int(1,30)
  heartbeat_interval_minutes: int(1,60)
  outbox_max_records: int(1000,1000000)
  outbox_max_age_days: int(1,30)

map:
  - addon_config:rw
  - media:rw
